version: "3.9"

services:
  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_DB: foody
      POSTGRES_USER: foody
      POSTGRES_PASSWORD: foody
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foody"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
